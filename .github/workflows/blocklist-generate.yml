                  #   blocklist_c2_ioc_aggressive       Indicators Of Compromise (IOCs) (Aggressive)
                  #                                         Comprehensive list of all botnet C2s Feodo Tracker has.
                  #                                         IP addresses are re-used/recycled; false positive are much higher.
